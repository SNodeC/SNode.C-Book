name: Finish book migration

on:
  push:
    branches: [SNode.C-2.0]
    paths:
      - 'ci/finish-book-migration.py'
      - '.github/workflows/finish-book-migration.yml'

permissions:
  contents: read

jobs:
  apply-reviewed-edits:
    if: github.repository == 'SNodeC/SNode.C-Book' && github.ref == 'refs/heads/SNode.C-2.0'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed editorial changes and check sources
        run: python3 ci/finish-book-migration.py
      - name: Commit to the isolated migration branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- manuscript/chapters production/metadata review/proposal
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete SNode.C 2.0 chapter, listing and proposal alignment'
          git push origin HEAD:refs/heads/SNode.C-2.0
          git rev-parse HEAD > "$RUNNER_TEMP/migration-provenance.txt"
          git show --stat --oneline HEAD >> "$RUNNER_TEMP/migration-provenance.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: migration-application-provenance
          path: ${{ runner.temp }}/migration-provenance.txt
          if-no-files-found: error
