name: Source snapshot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read framework baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          source source-baseline/book-source-baseline.env
          [[ "$SNODEC_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$SNODEC_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Check out exact framework source
        uses: actions/checkout@v4
        with:
          repository: SNodeC/snode.c
          ref: ${{ steps.baseline.outputs.commit }}
          path: external/snode.c
      - name: Archive tracked source and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-snapshot"
          git archive --format=tar.gz --output="$RUNNER_TEMP/source-snapshot/book-source.tar.gz" HEAD
          git -C external/snode.c archive --format=tar.gz --output="$RUNNER_TEMP/source-snapshot/framework-source.tar.gz" HEAD
          printf 'book=%s\nframework=%s\n' "$(git rev-parse HEAD)" "$(git -C external/snode.c rev-parse HEAD)" > "$RUNNER_TEMP/source-snapshot/provenance.txt"
          (cd "$RUNNER_TEMP/source-snapshot" && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: snodec-source-snapshot
          path: ${{ runner.temp }}/source-snapshot/
          if-no-files-found: error
          retention-days: 30
