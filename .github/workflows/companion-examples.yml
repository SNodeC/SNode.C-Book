name: Companion examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-companion-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            packages: g++
          - compiler: clang
            cc: clang
            cxx: clang++
            packages: clang

    name: Companion examples (${{ matrix.compiler }})

    steps:
      - name: Check out book repository
        uses: actions/checkout@v4

      - name: Read authoritative source pin
        id: baseline
        shell: bash
        run: |
          python3 ci/check-source-alignment.py
          source source-baseline/book-source-baseline.env
          echo "repository=$SNODEC_REPOSITORY_ID" >> "$GITHUB_OUTPUT"
          echo "ref=$SNODEC_REF" >> "$GITHUB_OUTPUT"

      - name: Check out pinned SNode.C
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.baseline.outputs.repository }}
          ref: ${{ steps.baseline.outputs.ref }}
          path: external/snode.c

      - name: Install C++ build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config python3 \
            libasio-dev libssl-dev zlib1g-dev libbluetooth-dev libmariadb-dev libmagic-dev \
            nlohmann-json3-dev \
            ${{ matrix.packages }}

      - name: Reconstruct the current source tree recorded by the book
        shell: bash
        run: |
          source source-baseline/book-source-baseline.env
          git -C external/snode.c apply "$GITHUB_WORKSPACE/$SNODEC_WORKTREE_PATCH"
          python3 ci/check-source-alignment.py --framework external/snode.c

      - name: Build SNode.C and companion examples
        id: build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          SNODEC_SOURCE_DIR: ${{ github.workspace }}/external/snode.c
          SNODEC_PREFIX: ${{ github.workspace }}/install/snodec
          BOOK_EXAMPLES_BUILD_DIR: ${{ github.workspace }}/build/ci-book-examples
        run: bash ci/build-companion-examples.sh

      - name: Run public exercise labs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SNODEC_PREFIX: ${{ github.workspace }}/install/snodec
        run: ctest --test-dir build/ci-book-examples --output-on-failure --no-tests=error

      - name: Run teaching-example smoke tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SNODEC_PREFIX: ${{ github.workspace }}/install/snodec
          BOOK_EXAMPLES_BUILD_DIR: ${{ github.workspace }}/build/ci-book-examples
        run: python3 ci/run-teaching-smoke-tests.py

      - name: Run selected behavioral smoke tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SNODEC_PREFIX: ${{ github.workspace }}/install/snodec
          BOOK_EXAMPLES_BUILD_DIR: ${{ github.workspace }}/build/ci-book-examples
        run: bash ci/run-behavior-smoke-tests.sh

      - name: Check SSE lifetime and WebSocket echo
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          SNODEC_PREFIX: ${{ github.workspace }}/install/snodec
          BOOK_EXAMPLES_BUILD_DIR: ${{ github.workspace }}/build/ci-book-examples
        run: |
          python3 ci/run-example-lifetime-tests.py \
            --prefix "$SNODEC_PREFIX" --build "$BOOK_EXAMPLES_BUILD_DIR" \
            --work build/example-lifetime-checks \
            | tee build/verification-logs/example-lifetime-checks.txt

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-verification-${{ matrix.compiler }}
          path: |
            build/verification-logs/
            build/ci-book-examples/Testing/Temporary/
            build/teaching-smoke-logs/
            build/behavior-smoke-logs/
            build/example-lifetime-checks/runtime-logs/
            build/snodec/Testing/Temporary/
          if-no-files-found: warn
