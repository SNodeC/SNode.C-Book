name: Book package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-book-package:
    runs-on: ubuntu-22.04
    # TeX Live 2026, 2026-07-01 image; keep package versions stable across runs.
    container:
      image: ghcr.io/xu-cheng/texlive-debian@sha256:3bdf292b53c04ffa3ca694a5114397859bcd39b6b417c212414e1505e7fe8ec5
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install publication dependencies
        run: |
          apt-get update
          apt-get install -y cmake ninja-build python3 curl ca-certificates xz-utils

          # Match the Pandoc ABI reported by the fixed crossref binary.
          curl -fsSL \
            https://github.com/jgm/pandoc/releases/download/3.9.0.2/pandoc-3.9.0.2-1-amd64.deb \
            -o /tmp/pandoc.deb
          dpkg -i /tmp/pandoc.deb

          # Keep the pandoc-crossref version used by the verified local build.
          curl -fsSL \
            https://github.com/lierdakil/pandoc-crossref/releases/download/v0.3.24a/pandoc-crossref-Linux-X64.tar.xz \
            | tar -xJ -C /usr/local/bin pandoc-crossref

          pandoc --version
          pandoc-crossref --version
          xelatex --version | grep -F 'TeX Live 2026'

      - name: Verify Pandoc and crossref ABI compatibility
        run: python3 ci/check-publication-tools.py

      - name: Check source hygiene
        run: bash ci/check-source-hygiene.sh

      - name: Build proposal package and PDFs
        run: bash ci/build-book-package.sh

      - name: Upload publisher submission artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snodec-book-proposal-package
          path: |
            dist/pdf/book-proposal-package.pdf
            dist/pdf/book-proposal-sample-package.pdf
            dist/pdf/snodec-book.pdf
            dist/packages/snodec-book-proposal-package.tar.gz
          if-no-files-found: error
